name: release

# Publishing a GitHub release (tag vX.Y.Z) builds the package, tests the built wheel, uploads it to
# TestPyPI, then to PyPI. No passwords or tokens: PyPI trusts this workflow ("trusted publishing").
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version
        run: |
          version=$(uv version --short)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but version $version"; exit 1; }
      - name: Build
        run: uv build
      - name: Test the built wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl python -c "import pandera_chem as pc; assert pc.inchikey('CCO') == 'LFQSCWFLJHTTHZ-UHFFFAOYSA-N'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pandera-chem/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pandera-chem/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
